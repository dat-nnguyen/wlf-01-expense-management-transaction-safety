services:
  postgres:
    image: postgres:16-alpine
    container_name: wealify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: wealify_guardian
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wealify-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/wealify_guardian
      APP_ENV: development
      LLM_PROVIDER: mock
      APP_PORT: 8000
    ports:
      - "8001:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: wealify-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      PORT: 3000
    ports:
      - "3001:3000"

volumes:
  postgres_data:

